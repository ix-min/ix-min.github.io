<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fcf8ff" />
    <title>Colordoku</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <style>
      :root {
        --bg: #fcf8ff;
        --sf: #f3effa;
        --sf2: #e8e2f4;
        --on: #1c1a27;
        --on2: #5d5a70;
        --pr: #4647c9;
        --onpr: #fff;
        --prc: #e1e0ff;
        --onprc: #0c0a6b;
        --er: #ba1a1a;
        --erc: #ffdad6;
        --ink: #2b2845;
        --ol: #cbc5da;
        --rs: 72%;
        --rl: 86%;
        --ff: 'Noto Sans KR', system-ui, sans-serif;
        --fd: 'Fredoka', 'Noto Sans KR', system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #141320;
          --sf: #1f1d2e;
          --sf2: #2a2840;
          --on: #e6e1f2;
          --on2: #aaa5be;
          --pr: #bfc0ff;
          --onpr: #10106e;
          --prc: #2f3099;
          --onprc: #e1e0ff;
          --er: #ffb4ab;
          --erc: #5c1a16;
          --ink: #f1edff;
          --ol: #484560;
          --rs: 34%;
          --rl: 31%;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #141320;
        --sf: #1f1d2e;
        --sf2: #2a2840;
        --on: #e6e1f2;
        --on2: #aaa5be;
        --pr: #bfc0ff;
        --onpr: #10106e;
        --prc: #2f3099;
        --onprc: #e1e0ff;
        --er: #ffb4ab;
        --erc: #5c1a16;
        --ink: #f1edff;
        --ol: #484560;
        --rs: 34%;
        --rl: 31%;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--on);
        font: 400 16px/1.5 var(--ff);
        min-height: 100dvh;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }
      button:focus-visible {
        outline: 3px solid var(--pr);
        outline-offset: 2px;
      }
      #app {
        max-width: 520px;
        margin: 0 auto;
        padding: 8px 16px 28px;
      }
      svg.i {
        width: 24px;
        height: 24px;
        fill: currentColor;
        flex: none;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 56px;
      }
      .bar .ti {
        flex: 1;
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .bar .ti b {
        font: 600 18px var(--fd);
      }
      .bar .ti span {
        font-size: 13px;
        color: var(--on2);
      }
      .ib {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      .ib:hover {
        background: var(--sf2);
      }
      .fb,
      .tb,
      .tonal {
        height: 48px;
        padding: 0 24px;
        border-radius: 24px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .fb {
        background: var(--pr);
        color: var(--onpr);
        box-shadow:
          0 1px 3px #0003,
          0 4px 10px #0002;
      }
      .tonal {
        background: var(--prc);
        color: var(--onprc);
      }
      .tb {
        color: var(--pr);
      }
      .fb:active,
      .tonal:active {
        transform: scale(0.97);
      }
      .hero h1 {
        font: 600 clamp(44px, 14vw, 64px)/1 var(--fd);
        margin: 12px 0 4px;
        letter-spacing: -0.5px;
      }
      .hero p {
        margin: 0 0 16px;
        color: var(--on2);
      }
      .card {
        background: var(--sf);
        border-radius: 28px;
        padding: 16px;
      }
      .mini {
        width: min(220px, 62%);
        margin: 16px auto 20px;
        display: block;
        pointer-events: none;
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .big {
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        width: 100%;
        padding: 20px;
        border-radius: 28px;
        background: var(--sf2);
        transition: transform 0.15s;
      }
      .big:hover {
        transform: translateY(-1px);
      }
      .big b {
        display: block;
        font: 600 20px var(--fd);
      }
      .big small {
        color: var(--on2);
        font-size: 14px;
      }
      .big .dot {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: var(--prc);
        color: var(--onprc);
        display: grid;
        place-items: center;
        font: 600 20px var(--fd);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      h2 {
        font: 600 22px var(--fd);
        margin: 20px 0 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 10px;
      }
      .st {
        height: 84px;
        border-radius: 20px;
        background: var(--sf2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font: 600 20px var(--fd);
      }
      .st small {
        font: 400 12px var(--ff);
        color: var(--on2);
      }
      .st.done {
        background: var(--prc);
        color: var(--onprc);
      }
      .st.done small {
        color: inherit;
      }
      .st[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .seg button {
        height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--ol);
        font-weight: 500;
      }
      .seg button[aria-pressed='true'] {
        background: var(--prc);
        color: var(--onprc);
        border-color: transparent;
        font-weight: 700;
      }
      .chips {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 4px 0 14px;
      }
      .chip {
        background: var(--sf);
        padding: 4px 14px;
        border-radius: 16px;
        font: 500 15px var(--fd);
        min-width: 68px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .bd {
        --n: 5;
        display: grid;
        grid-template-columns: repeat(var(--n), minmax(0, 1fr));
        grid-template-rows: repeat(var(--n), minmax(0, 1fr));
        aspect-ratio: 1;
        width: min(100%, max(260px, calc(100dvh - 340px)), 560px);
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 1px 3px #0003,
          0 6px 16px #0002;
        background: var(--on);
      }
      .cell {
        --t: 0;
        --r: 0;
        --b: 0;
        --l: 0;
        padding: 0;
        border-style: solid;
        border-width: calc(1px + var(--t) * 2.5px) calc(1px + var(--r) * 2.5px)
          calc(1px + var(--b) * 2.5px) calc(1px + var(--l) * 2.5px);
        border-color: color-mix(
            in srgb,
            var(--on) calc(14% + var(--t) * 76%),
            transparent
          )
          color-mix(in srgb, var(--on) calc(14% + var(--r) * 76%), transparent)
          color-mix(in srgb, var(--on) calc(14% + var(--b) * 76%), transparent)
          color-mix(in srgb, var(--on) calc(14% + var(--l) * 76%), transparent);
        background: hsl(var(--h) var(--rs) var(--rl));
        color: var(--ink);
        display: grid;
        place-items: center;
        position: relative;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: filter 0.12s;
      }
      button.cell:active {
        filter: brightness(0.93);
      }
      .cell {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .cell svg {
        width: 66%;
        height: 66%;
        max-width: 100%;
        max-height: 100%;
        pointer-events: none;
      }
      .cell .bird {
        animation: pop 0.22s ease-out;
      }
      .cell.x svg {
        width: 44%;
        height: 44%;
        opacity: 0.6;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        fill: none;
      }
      .cell.gh .ghost {
        opacity: 0.5;
      }
      .cell.gh::before {
        content: '';
        position: absolute;
        inset: 14%;
        border: 2.5px dashed var(--pr);
        border-radius: 50%;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .cell.bad {
        outline: 3px solid var(--er);
        outline-offset: -3px;
        z-index: 2;
        animation: shake 0.3s;
      }
      .cell.bad::after {
        content: '!';
        position: absolute;
        top: 3px;
        right: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--er);
        color: var(--bg);
        font: 700 12px/16px var(--ff);
        text-align: center;
      }
      .cell.cf {
        outline: 3px dashed var(--er);
        outline-offset: -3px;
        z-index: 2;
      }
      .cell:focus-visible {
        outline: 3px solid var(--pr);
        outline-offset: -3px;
        z-index: 3;
      }
      .paused {
        aspect-ratio: 1;
        width: min(100%, 420px);
        margin: 0 auto;
        display: grid;
        place-content: center;
        gap: 16px;
        text-align: center;
        background: var(--sf);
        border-radius: 28px;
      }
      .tip {
        text-align: center;
        color: var(--on2);
        font-size: 13px;
        margin: 12px 0;
      }
      .ctl {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .ctl button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 72px;
        padding: 10px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }
      .ctl button:hover {
        background: var(--sf2);
      }
      .ctl button[disabled] {
        opacity: 0.38;
        cursor: default;
      }
      .ctl .hb {
        background: var(--prc);
        color: var(--onprc);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: #0006;
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 20;
        animation: fade 0.15s;
      }
      .sheet {
        background: var(--bg);
        border-radius: 28px;
        padding: 24px;
        width: min(100%, 400px);
        max-height: 88dvh;
        overflow: auto;
        box-shadow: 0 8px 32px #0005;
      }
      .sheet h2 {
        margin-top: 0;
      }
      .sheet p {
        margin: 8px 0;
      }
      .act {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .stat {
        display: flex;
        justify-content: space-around;
        background: var(--sf);
        border-radius: 20px;
        padding: 14px;
        margin: 12px 0;
      }
      .stat div {
        text-align: center;
        color: var(--on2);
        font-size: 13px;
      }
      .stat b {
        display: block;
        font: 600 24px var(--fd);
        color: var(--on);
      }
      #sb {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 24px);
        opacity: 0;
        pointer-events: none;
        background: var(--on);
        color: var(--bg);
        padding: 12px 18px;
        border-radius: 14px;
        display: flex;
        gap: 10px;
        align-items: center;
        max-width: calc(100% - 32px);
        font-size: 14px;
        transition: all 0.2s;
        z-index: 30;
      }
      #sb.on {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      .sw {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
      }
      .help li {
        margin: 8px 0;
      }
      .help ol {
        padding-left: 20px;
      }
      .spin {
        width: 36px;
        height: 36px;
        border: 4px solid var(--prc);
        border-top-color: var(--pr);
        border-radius: 50%;
        animation: rot 0.8s linear infinite;
        margin: auto;
      }
      .hl {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--sf);
        border-radius: 16px;
        margin-top: 8px;
        width: 100%;
        text-align: left;
      }
      @keyframes pop {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes shake {
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes rot {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      :root[data-motion='reduce'] * {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dlg"></div>
    <div id="sb" role="status" aria-live="polite"></div>
    <script>
      'use strict';
      /* ========== ENGINE (React/DOM 비의존) ========== */
      //ENGINE-START
      const GEN = 'g1';
      function hs(s) {
        let h = 1779033703 ^ s.length;
        for (let i = 0; i < s.length; i++) {
          h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^ (h >>> 16)) >>> 0;
      }
      function rng(seed) {
        let a = hs(seed);
        return () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const shuffle = (a, R) => {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(R() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const adj = (a, b) =>
        Math.max(Math.abs(a.row - b.row), Math.abs(a.col - b.col)) <= 1;
      function makeBoard(grid) {
        const n = grid.length,
          regions = Array.from({ length: n }, (_, i) => ({
            id: i,
            colorToken: 'r' + i,
            cells: [],
          }));
        const cells = grid.map((row, r) =>
          row.map((g, c) => {
            regions[g] && regions[g].cells.push({ row: r, col: c });
            return { row: r, col: c, regionId: g };
          }),
        );
        return { size: n, cells, regions };
      }
      function validateBoard(B) {
        const n = B.size;
        if (B.regions.length !== n || B.cells.length !== n) return false;
        for (const g of B.regions) {
          if (!g.cells.length) return false;
          const seen = new Set([g.cells[0].row * n + g.cells[0].col]),
            q = [g.cells[0]];
          while (q.length) {
            const p = q.pop();
            for (const [dr, dc] of [
              [1, 0],
              [-1, 0],
              [0, 1],
              [0, -1],
            ]) {
              const r = p.row + dr,
                c = p.col + dc;
              if (
                r >= 0 &&
                c >= 0 &&
                r < n &&
                c < n &&
                B.cells[r][c].regionId === g.id &&
                !seen.has(r * n + c)
              ) {
                seen.add(r * n + c);
                q.push({ row: r, col: c });
              }
            }
          }
          if (seen.size !== g.cells.length) return false;
        }
        return B.cells.every(row => row.length === n);
      }
      function validatePlacement(B, birds, c) {
        const n = B.size;
        if (!(c.row >= 0 && c.col >= 0 && c.row < n && c.col < n))
          return { valid: false, conflicts: ['bounds'] };
        const g = B.cells[c.row][c.col].regionId,
          cf = new Set();
        for (const b of birds) {
          if (b.row === c.row) cf.add('row');
          if (b.col === c.col) cf.add('column');
          if (B.cells[b.row][b.col].regionId === g) cf.add('region');
          if (adj(b, c)) cf.add('adjacency');
        }
        return { valid: !cf.size, conflicts: [...cf] };
      }
      function validateSolution(B, birds) {
        if (birds.length !== B.size) return false;
        const R = new Set(),
          C = new Set(),
          G = new Set();
        for (const b of birds) {
          R.add(b.row);
          C.add(b.col);
          G.add(B.cells[b.row][b.col].regionId);
        }
        if (R.size !== B.size || C.size !== B.size || G.size !== B.size)
          return false;
        return birds.every((a, i) =>
          birds.every((b, j) => i >= j || !adj(a, b)),
        );
      }
      function solvePuzzle(B, limit = 2) {
        const t0 = performance.now(),
          n = B.size,
          sols = [],
          cur = [];
        let used = 0,
          reg = 0,
          nodes = 0;
        (function go(r) {
          if (r === n) {
            sols.push(cur.map((c, i) => ({ row: i, col: c })));
            return;
          }
          for (let c = 0; c < n; c++) {
            nodes++;
            if ((used >> c) & 1) continue;
            if (r && Math.abs(c - cur[r - 1]) <= 1) continue;
            const g = B.cells[r][c].regionId;
            if ((reg >> g) & 1) continue;
            used |= 1 << c;
            reg |= 1 << g;
            cur[r] = c;
            go(r + 1);
            used &= ~(1 << c);
            reg &= ~(1 << g);
            if (sols.length >= limit) return;
          }
        })(0);
        return {
          solutionCount: sols.length,
          solutions: sols,
          isUnique: sols.length === 1,
          elapsedMs: performance.now() - t0,
          nodesVisited: nodes,
        };
      }
      function genSolution(n, R) {
        const cur = [],
          used = [];
        const go = r => {
          if (r === n) return true;
          for (const c of shuffle([...Array(n).keys()], R)) {
            if (used[c] || (r && Math.abs(c - cur[r - 1]) <= 1)) continue;
            used[c] = 1;
            cur[r] = c;
            if (go(r + 1)) return true;
            used[c] = 0;
          }
          return false;
        };
        return go(0) ? cur.map((c, i) => ({ row: i, col: c })) : null;
      }
      function growRegions(n, sol, R) {
        const g = Array.from({ length: n }, () => Array(n).fill(-1)),
          sz = Array(n).fill(1);
        let left = n * n - n;
        sol.forEach((p, i) => (g[p.row][p.col] = i));
        while (left > 0) {
          const opts = [];
          for (let r = 0; r < n; r++)
            for (let c = 0; c < n; c++)
              if (g[r][c] < 0)
                for (const [dr, dc] of [
                  [1, 0],
                  [-1, 0],
                  [0, 1],
                  [0, -1],
                ]) {
                  const q = g[r + dr]?.[c + dc];
                  if (q >= 0) opts.push([r, c, q]);
                }
          const a = opts[Math.floor(R() * opts.length)],
            b = opts[Math.floor(R() * opts.length)],
            p = sz[a[2]] <= sz[b[2]] ? a : b;
          g[p[0]][p[1]] = p[2];
          sz[p[2]]++;
          left--;
        }
        return g;
      }
      function repair(grid, sol, R) {
        const n = grid.length;
        for (let step = 0; step < 400; step++) {
          const B = makeBoard(grid);
          if (!validateBoard(B)) return null;
          const s = solvePuzzle(B, 2);
          if (s.solutionCount === 1)
            return s.solutions[0].every((p, i) => p.col === sol[i].col)
              ? B
              : null;
          const other = s.solutions.find(x =>
            x.some((p, i) => p.col !== sol[i].col),
          );
          if (!other) return null;
          const cand = shuffle(
            other.filter((p, i) => p.col !== sol[i].col),
            R,
          );
          let moved = false;
          for (const q of cand) {
            const g = grid[q.row][q.col];
            for (const [dr, dc] of shuffle(
              [
                [1, 0],
                [-1, 0],
                [0, 1],
                [0, -1],
              ],
              R,
            )) {
              const h = grid[q.row + dr]?.[q.col + dc];
              if (h === undefined || h === g) continue;

          elapsed: 0,
          hints: 0,
          moves: 0,
          hint: null,
          paused: false,
          flash: null,
        };
        if (saved && sane(saved, o.size)) Object.assign(G, saved);
        last = performance.now();
        go('game');
        persist();
      }
      const newSeed = () => Math.random().toString(36).slice(2, 8);
      function go(s) {
        flushPend(true);
        closeDlg();
        scr = s;
        if (s !== 'game') {
          persist();
          G = s === 'home' || s === 'stages' || s === 'inf' ? null : G;
        }
        render();
        window.scrollTo(0, 0);
      }
      function push() {
        G.hist = G.hist.slice(0, G.hi + 1);
        G.hist.push({ b: cp(G.birds), e: cp(G.ex) });
        G.hi = G.hist.length - 1;
        persist();
      }
      function restore() {
        const h = G.hist[G.hi];
        G.birds = cp(h.b);
        G.ex = cp(h.e);
        persist();
        render();
      }
      function single(r, c) {
        if (!G || G.status !== 'playing' || G.paused) return;
        if (idx(G.birds, r, c) >= 0) return;
        const i = idx(G.ex, r, c);
        i >= 0 ? G.ex.splice(i, 1) : G.ex.push({ row: r, col: c });
        push();
        render();
      }
      function dbl(r, c) {
        if (!G || G.status !== 'playing' || G.paused) return;
        const bi = idx(G.birds, r, c);
        if (bi >= 0) {
          G.birds.splice(bi, 1);
          G.moves++;
          push();
          buzz(10);
          render();
          return;
        }
        const v = validatePlacement(G.p.board, G.birds, { row: r, col: c });
        if (!v.valid) {
          const M = {
            row: '이 행에는 이미 고양이가 있어요',
            column: '이 열에는 이미 고양이가 있어요',
            region: '이 색 영역에는 이미 고양이가 있어요',
            adjacency: '고양이끼리는 대각선 포함 맞닿을 수 없어요',
            bounds: '보드 밖이에요',
          };
          const g = G.p.board.cells[r][c].regionId,
            cf = G.birds.filter(
              b =>
                b.row === r ||
                b.col === c ||
                G.p.board.cells[b.row][b.col].regionId === g ||
                adj(b, { row: r, col: c }),
            );
          G.flash = { r, c, cf };
          render();
          clearTimeout(flashT);
          flashT = setTimeout(() => {
            if (G) {
              G.flash = null;
              render();
            }
          }, 900);
          toast(M[v.conflicts[0]], 1);
          buzz([20, 40, 20]);
          return;
        }
        const xi = idx(G.ex, r, c);
        if (xi >= 0) G.ex.splice(xi, 1);
        G.birds.push({ row: r, col: c });
        G.moves++;
        if (G.hint && G.hint.row === r && G.hint.col === c) G.hint = null;
        buzz(10);
        push();
        if (validateSolution(G.p.board, G.birds)) finish();
        else render();
      }
      function hint() {
        if (G.status !== 'playing') return toast('이미 완성한 퍼즐이에요');
        if (G.hint && idx(G.birds, G.hint.row, G.hint.col) < 0)
          return toast(`표시된 힌트: ${G.hint.row + 1}행 ${G.hint.col + 1}열`);
        const need = G.p.solution.filter(s => idx(G.birds, s.row, s.col) < 0),
          ok = need.filter(s => validatePlacement(G.p.board, G.birds, s).valid),
          p = (ok.length ? ok : need)[0];
        if (!p) return;
        G.hint = { row: p.row, col: p.col };
        G.hints++;
        persist();
        render();
        toast(`힌트: ${p.row + 1}행 ${p.col + 1}열에 고양이가 들어가요`);
      }
      function finish() {
        G.status = 'completed';
        const t = Math.round(G.elapsed);
        if (G.mode === 'stage') {
          const r = S.stages[G.stage] || {};
          S.stages[G.stage] = { done: 1, best: Math.min(r.best ?? 1e9, t) };
        } else {
          S.history.unshift({
            size: G.size,
            seed: G.seed,
            t,
            hints: G.hints,
            at: Date.now(),
          });
          S.history = S.history.slice(0, 20);
        }
        S.active = null;
        save();
        buzz([30, 50, 30]);
        render();
        const next = G.mode === 'stage' && G.stage + 1 < STAGES.length;
        dlg(`<h2>완성했어요!</h2><div class="stat"><div><b>${fmt(t)}</b>시간</div><div><b>${G.moves}</b>움직임</div><div><b>${G.hints}</b>힌트</div></div>
  <div class="act"><button class="tb" data-a="go" data-v="home">홈</button><button class="tonal" data-a="again">${G.mode === 'stage' ? '다시 하기' : '같은 퍼즐 다시'}</button>${G.mode === 'stage' ? (next ? '<button class="fb" data-a="nextS">다음 스테이지</button>' : '') : '<button class="fb" data-a="newInf">다음 퍼즐</button>'}</div>`);
      }
      const reset = () => {
        G.birds = [];
        G.ex = [];
        G.hist = [{ b: [], e: [] }];
        G.hi = 0;
        G.status = 'playing';
        G.elapsed = 0;
        G.hints = 0;
        G.moves = 0;
        G.hint = null;
        G.paused = false;
        G.flash = null;
        persist();
        render();
      };

      /* ========== 제스처 (Pointer Events, 두 번 탭 280ms) ========== */
      function flushPend(drop) {
        if (pend) {
          clearTimeout(pend.t);
          const p = pend;
          pend = null;
          if (!drop) single(p.r, p.c);
        }
      }
      function tap(r, c, x, y) {
        if (pend) {
          if (
            pend.r === r &&
            pend.c === c &&
            Math.hypot(x - pend.x, y - pend.y) < 28
          ) {
            clearTimeout(pend.t);
            pend = null;
            dbl(r, c);
            return;
          }
          flushPend();
        }
        pend = {
          r,
          c,
          x,
          y,
          t: setTimeout(() => {
            const p = pend;
            pend = null;
            if (p) single(p.r, p.c);
          }, DT),
        };
      }
      let pd = null;
      const app = $('#app');
      app.addEventListener('pointerdown', e => {
        const b = e.target.closest('.cell[data-r]');
        pd = b ? { b, x: e.clientX, y: e.clientY } : null;
      });
      app.addEventListener('pointerup', e => {
        const b = e.target.closest('.cell[data-r]');
        if (!pd || !b || b !== pd.b || e.button > 0) return;
        if (Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 10) {
          pd = null;
          return;
        }
        pd = null;
        tap(+b.dataset.r, +b.dataset.c, e.clientX, e.clientY);
      });
      app.addEventListener('keydown', e => {
        const b = e.target.closest('.cell[data-r]');
        if (!b) return;
        const r = +b.dataset.r,
          c = +b.dataset.c,
          n = G.size,
          D = {
            ArrowUp: [-1, 0],
            ArrowDown: [1, 0],
            ArrowLeft: [0, -1],
            ArrowRight: [0, 1],
          };
        if (D[e.key]) {
          e.preventDefault();
          const q = app.querySelector(
            `[data-r="${Math.max(0, Math.min(n - 1, r + D[e.key][0]))}"][data-c="${Math.max(0, Math.min(n - 1, c + D[e.key][1]))}"]`,
          );
          q && q.focus();
        } else if (e.key === 'x' || e.key === 'X') {
          e.preventDefault();
          flushPend();
          single(r, c);
        } else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          flushPend();
          dbl(r, c);
        }
      });
      app.addEventListener('click', e => {
        if (e.target.closest('.cell[data-r]') && e.detail > 0)
          e.preventDefault();
      });

      /* ========== 액션 ========== */
      const A = {
        go: v => go(v),
        close: () => closeDlg(),
        size: v => {
          infSize = +v;
          render();
        },
        stage: v =>
          startGame({
            mode: 'stage',
            size: STAGES[v].size,
            seed: STAGES[v].seed,
            stage: +v,
          }),
        inf: () => startGame({ mode: 'inf', size: infSize, seed: newSeed() }),
        hist: v => {
          const x = S.history[v];
          x && startGame({ mode: 'inf', size: x.size, seed: x.seed });
        },
        resume: () => S.active && startGame(S.active.o, S.active.st),
        retry: () => lastO && startGame(lastO),
        undo: () => {
          if (G.hi > 0) {
            G.hi--;
            restore();
          }
        },
        redo: () => {
          if (G.hi < G.hist.length - 1) {
            G.hi++;
            restore();
          }
        },
        hint,
        pause: () => {
          G.paused = !G.paused;
          persist();
          render();
        },
        restart: () =>
          dlg(
            '<h2>처음부터 다시 할까요?</h2><p>놓은 고양이와 시간이 모두 지워져요. 퍼즐은 그대로예요.</p><div class="act"><button class="tb" data-a="close">취소</button><button class="fb" data-a="doRestart">처음부터</button></div>',
          ),
        doRestart: () => {
          closeDlg();
          reset();
        },
        back: () => {
          persist();
          go('home');
        },
        again: () => {
          closeDlg();
          reset();
        },
        newInf: () => {
          closeDlg();
          startGame({ mode: 'inf', size: G.size, seed: newSeed() });
        },
        nextS: () => {
          const i = G.stage + 1;
          closeDlg();
          startGame({
            mode: 'stage',
            size: STAGES[i].size,
            seed: STAGES[i].seed,
            stage: i,
          });
        },
        setv: (v, e) => {
          const k = e.dataset.k;
          S.settings[k] = v === 'true' ? true : v === 'false' ? false : v;
          save();
          applyTheme();
          render();
        },
        reset: () =>
          dlg(
            '<h2>데이터를 초기화할까요?</h2><p>스테이지 기록, 무한 모드 기록, 이어하기 데이터가 모두 삭제돼요.</p><div class="act"><button class="tb" data-a="close">취소</button><button class="fb" data-a="doReset">초기화</button></div>',
          ),
        doReset: () => {
          S = defS();
          save();
          applyTheme();
          G = null;
          go('home');
        },
      };
      document.addEventListener('click', e => {
        const t = e.target.closest('[data-a]');
        if (t && A[t.dataset.a]) A[t.dataset.a](t.dataset.v, t);
      });

      /* ========== 타이머 (누적 방식, 숨김 탭 제외) ========== */
      let sv = 0;
      setInterval(() => {
        const n = performance.now(),
          dt = (n - last) / 1000;
        last = n;
        if (
          scr === 'game' &&
          G &&
          G.status === 'playing' &&
          !G.paused &&
          !document.hidden
        ) {
          G.elapsed += Math.min(dt, 2);
          const t = $('#tm');
          if (t) t.textContent = fmt(G.elapsed);
          if (++sv % 10 === 0) persist();
        }
      }, 500);
      document.addEventListener('visibilitychange', () => {
        last = performance.now();
        if (document.hidden) persist();
      });
      addEventListener('pagehide', persist);
      matchMedia('(prefers-color-scheme:dark)').addEventListener(
        'change',
        applyTheme,
      );

      applyTheme();
      render();
      generate(5, 'hero').then(p => {
        heroP = p;
        if (scr === 'home') render();
      });
    </script>
  </body>
</html>
